submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"  # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Pharmacovigilance and regulatory teams must analyze large volumes of
    adverse event reports to identify potential drug safety signals and
    manually verify whether regulatory submission packages contain the
    required information. This process is time-consuming, difficult to
    scale, and makes it challenging to efficiently prioritize potential
    safety signals and identify regulatory submission gaps.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We are building an AI-powered decision-support platform that analyzes
    FDA adverse event data to identify potential drug-event safety signals
    using disproportionality analysis such as the Proportional Reporting
    Ratio (PRR), while assessing regulatory submission readiness against
    structured CTD and ICH requirements. IBM Bob supports intelligent
    analysis, explanations, investigation workflows, and development
    assistance throughout the platform.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Drug-event safety signal detection from FAERS/AEMS adverse event data"
    - "PRR-based disproportionality analysis and potential signal ranking"
    - "Interactive dashboard for exploring drug safety signals and analysis results"
    - "Regulatory submission readiness assessment using CTD/ICH requirements"
    - "IBM Bob-powered explanations and investigation assistance"

  tech_stack:
    languages: ["Python", "TypeScript"]      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]         # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]             # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite"]                     # e.g., ["PostgreSQL", "Redis"]
    other: ["Pandas", "NumPy", "GitHub", "REST API"]  # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The combination of real-world pharmacovigilance signal detection and
    regulatory submission readiness in a single decision-support platform.
    The project connects statistical safety-signal analysis with regulatory
    gap identification and uses IBM Bob as an intelligent layer for
    explaining results and assisting investigation workflows.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The system is a decision-support prototype and does not establish
    medical causality, determine that a drug is unsafe, or provide
    regulatory approval or certification. FAERS/AEMS reports may contain
    incomplete, duplicated, or biased information, and regulatory readiness
    assessment depends on the completeness and accuracy of the provided
    submission information.

